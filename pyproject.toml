[project]
name = "pharmaops-ai"
version = "0.1.0"
description = "Independent fictional distribution support portfolio demo"
requires-python = ">=3.12,<3.14"
dependencies = [
  "streamlit>=1.50,<2",
  "fastapi>=0.119,<1",
  "uvicorn>=0.38,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.12,<3",
  "python-dotenv>=1.1,<2",
  "langchain>=1,<2",
  "langchain-groq>=1,<2",
  "langchain-openai>=1,<2",
  "langchain-chroma>=1,<2",
  "langchain-text-splitters>=1,<2",
  "langgraph>=1,<2",
  "fastembed>=0.7,<1",
  "azure-functions>=1.24,<2",
  "azure-storage-blob>=12.28,<13",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Keep complete translated sentences readable in the explicit UI catalog.
"pharmaops/i18n.py" = ["E501"]
